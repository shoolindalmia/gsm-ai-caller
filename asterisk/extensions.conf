[globals]
; 1 = use Asterisk answering-machine detection before the AI speaks.
; GSM voicemail detection is unreliable; leave 0 unless you test it.
USE_AMD=0
AGENT=127.0.0.1:9092

; Outbound calls answered by the customer land here (Originate Context=ai-agent).
[ai-agent]
exten => s,1,NoOp(AI call ${CALL_UUID})
 same => n,Answer()
 same => n,GotoIf($["${USE_AMD}" = "1"]?amd:talk)
 same => n(amd),AMD()
 same => n,GotoIf($["${AMDSTATUS}" = "MACHINE"]?machine:talk)
 same => n(talk),AudioSocket(${CALL_UUID},${AGENT})
 same => n,Hangup()
 same => n(machine),UserEvent(AIMachine,CallUUID: ${CALL_UUID})
 same => n,Hangup()

; Calls coming IN to your SIMs (customers calling back) are also answered by the AI.
[from-dinstar]
exten => _[0-9s+].,1,Set(CALL_UUID=${SHELL(cat /proc/sys/kernel/random/uuid | tr -d '\n')})
 same => n,Goto(ai-agent,s,1)
exten => s,1,Set(CALL_UUID=${SHELL(cat /proc/sys/kernel/random/uuid | tr -d '\n')})
 same => n,Goto(ai-agent,s,1)
