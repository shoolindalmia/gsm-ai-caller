; Dinstar UC2000-VG-32G as an IP trunk (peer-to-peer on your LAN, no registration).
; install.sh replaces DINSTAR_IP with your gateway's address.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[dinstar]
type=endpoint
transport=transport-udp
context=from-dinstar
disallow=all
allow=alaw,ulaw
aors=dinstar
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733
send_pai=no
trust_id_inbound=yes

[dinstar]
type=aor
contact=sip:DINSTAR_IP:5060
qualify_frequency=30

[dinstar]
type=identify
endpoint=dinstar
match=DINSTAR_IP
