# GSM AI Caller (Windows) — setup.ps1 copies this to config.yaml. Edit config.yaml, not this file.
# Everything runs on this PC: Whisper + Ollama + Piper/Windows voices. No cloud APIs. No Asterisk.
# Relative paths are relative to the program folder.

db_path: data/caller.db

sip:
  gateway_ip: 192.168.1.50       # Dinstar UC2000-VG-32G LAN IP
  gateway_port: 5060
  local_ip: auto                 # this PC's LAN IP (auto-detected)
  local_port: 5060
  rtp_port_start: 10000
  rtp_port_end: 10999
  username: ""                   # only if the Dinstar IP trunk requires authentication
  password: ""
  caller_id: ""                  # leave empty: the SIM's own number is shown
  dial_prefix: ""                # e.g. "0" if your SIMs need it

agent:
  max_call_seconds: 300
  no_response_seconds: 10        # caller silent this long -> "Hello?" once, then end
  rtp_timeout_seconds: 20        # no audio from the gateway this long -> hang up
  answer_inbound: true           # AI answers customers calling back on your SIMs

dialer:
  max_concurrent_calls: 4        # limited by GPU, not by the 32 SIM ports (see README)
  ring_timeout_sec: 35
  max_attempts: 3
  retry_delay_min: 60
  calling_hours: {start: "10:00", end: "19:00"}
  stagger_sec: 1.0               # gap between starting calls

stt:
  model: large-v3                # small / medium / large-v3
  device: cuda                   # cuda or cpu
  compute_type: float16          # float16 on GPU, int8 on CPU
  language: hi                   # hi, en, or null for auto-detect
  workers: 4

llm:
  ollama_url: http://127.0.0.1:11434
  model: qwen2.5:7b-instruct
  temperature: 0.4
  max_tokens: 120

tts:
  engine: piper                  # piper | windows (built-in Kalpana/Hemant voice) | parler (AI4Bharat, GPU)
  windows_voice: Hindi           # part of the Windows voice name, e.g. Kalpana, Hemant, Heera
  windows_rate: 0                # -10 (slow) .. 10 (fast)
  piper_model: voices/hi_IN-pratham-medium.onnx
  parler_model: ai4bharat/indic-parler-tts
  parler_description: "A female speaker delivers clear, natural Hindi speech at a moderate pace with very clear audio."

vad:
  energy_threshold_db: -38       # used if webrtcvad is not installed
  webrtc_aggressiveness: 2
  end_silence_ms: 700            # pause length that ends the caller's turn
  min_speech_ms: 250
  bargein_ms: 300                # caller talking this long interrupts the AI

web:
  host: 0.0.0.0
  port: 8080
  username: admin
  password: CHANGE_ME_WEB_PASSWORD
